name: Cost Guard

# Catches Cloud Run instances left running warm.
#
# min-instances is bumped by hand for a launch or a traffic spike, and the only thing that
# resets it is the next production deploy. Between deploys a forgotten bump costs roughly
# 10 EUR/month per service for an instance doing nothing, which is more than the rest of the
# bill put together. That is exactly what happened once: it stayed at 1 for 17 days.
#
# The check cannot live in the public monitoring routine, because min-instances is not
# observable from outside the project, and cold-start latency does not reveal it either (the
# uptime check keeps an instance warm even at min-instances 0). It needs real credentials,
# which this repo already has via Workload Identity Federation.
#
# Reports by opening a single issue, and closes it again once the setting is back to 0, so a
# deliberate bump during a launch is a visible reminder rather than a daily failure.

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 08:00 Europe/Paris
  workflow_dispatch:

env:
  GCP_REGION: europe-west1
  # No colon in the title: GitHub search would read it as a qualifier.
  ISSUE_TITLE: 'Cloud Run min-instances left above zero'

permissions:
  contents: read

jobs:
  check:
    name: Check Cloud Run min-instances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Read min-instances on every service
        id: check
        run: |
          # An unset annotation means scale-to-zero, which is the wanted state, so an empty
          # value reads as 0. A failed lookup is a different thing and must not read as 0 too:
          # that would report "all clear" (and close the issue) precisely when the guard cannot
          # see anything. The describe call is left to fail the step instead.
          offenders=""
          for svc in trustscoreagent-api trustscoreagent-api-staging; do
            if ! min=$(gcloud run services describe "$svc" \
              --region "$GCP_REGION" \
              --format "value(spec.template.metadata.annotations['autoscaling.knative.dev/minScale'])"); then
              echo "::error::Could not read min-instances for $svc"
              exit 1
            fi
            min=${min:-0}
            echo "$svc: min-instances=$min"
            if [ "$min" != "0" ]; then
              offenders="${offenders}- \`${svc}\`: min-instances = ${min} (about $(( min * 10 )) EUR/month idle)"$'\n'
            fi
          done

          if [ -n "$offenders" ]; then
            {
              echo "offenders<<EOF"
              echo "$offenders"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or close the cost issue
        env:
          GH_TOKEN: ${{ github.token }}
          OFFENDERS: ${{ steps.check.outputs.offenders }}
        run: |
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number --jq '.[0].number // empty')

          if [ -z "$OFFENDERS" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "Back to scale-to-zero on every service. Closing automatically."
              echo "Resolved: closed issue #${existing}."
            else
              echo "All services are at min-instances 0."
            fi
            exit 0
          fi

          body=$(cat <<EOF
          A Cloud Run service is holding a warm instance:

          ${OFFENDERS}
          A warm instance costs roughly 10 EUR/month per service (1 vCPU + 512Mi, billed while
          idle), against a total bill of about 8 EUR/month, so this more than doubles it.

          If this is a deliberate bump for a launch, ignore this issue and it will close itself
          once you set it back:

          \`\`\`
          gcloud run services update <service> --region ${GCP_REGION} --min-instances 0
          \`\`\`

          Note that the next production deploy also resets it to 0 on its own.
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still warm as of $(date -u +%Y-%m-%d)."
            echo "Already reported in issue #${existing}."
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
