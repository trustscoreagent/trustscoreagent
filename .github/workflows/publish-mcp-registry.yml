name: Publish to MCP Registry

# Publishes mcp-server/server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub OIDC — no secrets, no
# interactive login. Ownership of the io.github.trustscoreagent/* namespace is
# proven by the workflow running under this org's repository identity.
#
# Prerequisite: the npm package @trustscoreagent/mcp-server must already be
# published at the version in server.json, and its published package.json must
# carry the matching "mcpName" field. npm publishing is manual (the account
# requires interactive 2FA), so run this AFTER `npm publish`.
#
# Trigger it either by pushing a tag (v0.1.1) or manually from the Actions tab
# / `gh workflow run "Publish to MCP Registry"`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # server.json is edited by hand and once sat at 0.1.1 while npm was at 0.2.2, so the registry
      # kept advertising a version from before rating signatures. Refuse to publish unless
      # server.json, package.json and npm agree.
      - name: Check versions agree
        working-directory: mcp-server
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRV_NPM=$(node -p "require('./server.json').packages[0].version")
          MAN=$(node -p "require('./manifest.json').version")
          echo "package.json $PKG, server.json $SRV / $SRV_NPM, manifest.json $MAN"
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$SRV_NPM" ] || [ "$PKG" != "$MAN" ]; then
            echo "::error::Versions disagree: bump server.json and manifest.json to $PKG"
            exit 1
          fi
          if ! npm view "@trustscoreagent/mcp-server@$PKG" version >/dev/null 2>&1; then
            echo "::error::@trustscoreagent/mcp-server@$PKG is not on npm yet: run npm publish first"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        working-directory: mcp-server
        run: ../mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        working-directory: mcp-server
        run: |
          set +e
          OUT=$(../mcp-publisher publish 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            # A re-run or a tag on an already-published version is a clean no-op,
            # not a failure — the registry only stores metadata for a given version once.
            if echo "$OUT" | grep -qi "duplicate version"; then
              echo "::notice::server.json version already on the MCP Registry — nothing to publish."
              exit 0
            fi
            exit $CODE
          fi
