name: Dependabot auto-merge

# Enables auto-merge for Dependabot patch & minor updates once the required
# checks pass, so they no longer need manual babysitting. MAJOR updates are left
# open for manual review on purpose — a major bump of a runtime dependency can
# change behaviour that CI (which runs against a local redis:7, not our real
# Upstash) does not cover. See the StackExchange.Redis 2.x -> 3.x case.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch & minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
